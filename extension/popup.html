<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Clockpin</title>
<link rel="stylesheet" href="ui.css">
<script src="common.js"></script>
<style>
  body { width: 320px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .now { display: flex; flex-direction: column; line-height: 1.2; }
  .now .l { font-size: 11px; color: var(--muted); }
  .now .c { font-family: var(--round); font-size: 16px; font-variant-numeric: tabular-nums; }
  .right { display: flex; align-items: center; gap: 6px; }
  .seg { display: flex; background: var(--surf); border-radius: 16px; padding: 2px; }
  .seg button { all: unset; cursor: pointer; font-size: 12px; padding: 4px 10px; border-radius: 14px; color: var(--muted); }
  .seg button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .gear { all: unset; cursor: pointer; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
  .gear:hover { background: var(--surf); }
  .gear svg { width: 17px; height: 17px; }

  /* 설정(팝업 안) */
  .back { all: unset; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; padding: 3px 6px 3px 0; }
  .back svg { width: 18px; height: 18px; }
  .card { background: var(--surf); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; font-size: 13px; }
  .card p { margin: 0; font-size: 11.5px; color: var(--muted); }
  .tri { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 3px; }
  .tri label { flex: 1; text-align: center; cursor: pointer; font-size: 12.5px; padding: 5px 0; border-radius: 8px; color: var(--muted); }
  .tri input { position: absolute; opacity: 0; pointer-events: none; }
  .tri label:has(input:checked) { background: var(--ink); color: var(--bg); }
  .tri label:has(input:focus-visible) { outline: 2px solid var(--coral); outline-offset: 1px; }
  .pre { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pre input { width: 100%; font: inherit; font-size: 14px; text-align: center; padding: 6px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .tg { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; }
  .tg input { appearance: none; margin: 0; width: 36px; height: 20px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .tg input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .tg input:checked { background: var(--coral); }
  .tg input:checked::after { left: 18px; }
  .tg input:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  .mini { all: unset; cursor: pointer; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--bg); align-self: flex-start; }
  .pane { display: flex; flex-direction: column; gap: 12px; }

  /* 다이얼 */
  .wheels { position: relative; display: flex; justify-content: center; align-items: center; gap: 2px; padding-top: 4px; }
  .band { position: absolute; left: 4px; right: 4px; top: 96px; height: 46px; background: var(--surf); border-radius: 16px; box-shadow: 0 4px 12px var(--sh); pointer-events: none; }
  .wcolw { display: flex; flex-direction: column; align-items: center; z-index: 1; }
  .wcol { width: 70px; height: 230px; padding-block: 92px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent); mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent); }
  .wcol::-webkit-scrollbar { display: none; }
  .wcol div { height: 46px; line-height: 46px; text-align: center; scroll-snap-align: center; font-family: var(--round); font-size: 32px; cursor: ns-resize; }
  /* 휠·드래그는 popup.js가 직접 처리한다. 브라우저 스크롤·스냅은 끈다 */
  .wcol.drag { scroll-snap-type: none; overflow-y: hidden; touch-action: none; cursor: grab; user-select: none; }
  .wcol.drag.grabbing { cursor: grabbing; }
  .wcol.drag div { cursor: inherit; transition: color .12s; }
  .wcol div.on { color: var(--coral); }
  .wcol.drag:focus-visible { outline: 2px solid var(--coral); outline-offset: -2px; border-radius: 12px; }
  .wcol.ap div { font-size: 20px; }
  .wsep { font-family: var(--round); font-size: 26px; color: var(--muted); z-index: 1; }
  /* 다이얼을 지금 시각으로(돌린 뒤에만 보임) */
  .rz { all: unset; cursor: pointer; position: absolute; right: 8px; top: 104px; z-index: 2; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); transition: opacity .15s; }
  .rz:hover { background: var(--bg); color: var(--coral); }
  .rz:focus-visible { outline: 2px solid var(--coral); outline-offset: 1px; }
  .rz svg { width: 19px; height: 19px; }
  .rz.off { opacity: 0; pointer-events: none; }
  /* 영어: 2 : 30 PM 순서, 되돌리기 아이콘은 왼쪽 빈자리로 */
  html[lang="en"] .wcolw.apw { order: 9; }
  html[lang="en"] .rz { right: auto; left: 8px; }
  /* 칩 5개를 늘 한 줄에 */
  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .chip { all: unset; cursor: pointer; text-align: center; font-size: 12.5px; padding: 5px 0; border-radius: 99px; background: var(--surf); box-shadow: 0 2px 6px var(--sh); white-space: nowrap; }
  .chip:hover { color: var(--coral); }
  .tmr { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: var(--coral); border-radius: 6px; padding: 0 6px; margin-right: 4px; vertical-align: 1px; }

  /* 링(R1) */
  .ring { position: relative; width: 190px; height: 190px; margin: 4px auto 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .tr { fill: none; stroke: var(--surf); stroke-width: 12; }
  .ring .pg { fill: none; stroke: var(--coral); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .2s linear; }
  .ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .ring .ampm { font-size: 14px; }
  .ring .left { font-family: var(--round); font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
  .ring .sub { font-size: 12px; color: var(--muted); }
  .ring .sub b { font-family: var(--round); font-weight: 400; font-size: 15px; color: var(--ink); }
  body.done .ring .pg { stroke: var(--done); }
  body.done .ring .left { color: var(--done); animation: blink 1s steps(2) infinite; }
  .row .gap { flex: 0 0 6px; }
  .ib { all: unset; cursor: pointer; flex: 0 0 42px; height: 42px; border-radius: 50%; background: var(--surf); color: var(--muted); display: grid; place-items: center; }
  .ib:hover { color: var(--done); box-shadow: 0 0 0 2px var(--line) inset; }
  .ib:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  .ib svg { width: 18px; height: 18px; }
  body.done .ring .sub { color: var(--done); font-weight: 600; }
  /* 타이머 일시정지: 숫자를 흐리게 */
  body.paused .ring .pg { stroke: var(--muted); }
  body.paused .ring .left { color: var(--muted); }
</style>
</head>
<body>
  <header class="ph" id="sethead" hidden>
    <button class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="settings"></span></button>
  </header>
  <header class="ph" id="head">
    <div class="now"><span class="l" data-i18n="now"></span><span class="c" id="clock"></span></div>
    <div class="right">
      <div class="seg" role="tablist">
        <button role="tab" data-tab="at" aria-selected="true" data-i18n="tabAlarm"></button>
        <button role="tab" data-tab="cd" aria-selected="false" data-i18n="tabTimer"></button>
      </div>
      <button class="gear" id="opts" data-i18n-title="settings" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9.87 5.02 L10.48 2.42 L13.52 2.42 L14.13 5.02 L15.43 5.55 L17.70 4.15 L19.85 6.30 L18.45 8.57 L18.98 9.87 L21.58 10.48 L21.58 13.52 L18.98 14.13 L18.45 15.43 L19.85 17.70 L17.70 19.85 L15.43 18.45 L14.13 18.98 L13.52 21.58 L10.48 21.58 L9.87 18.98 L8.57 18.45 L6.30 19.85 L4.15 17.70 L5.55 15.43 L5.02 14.13 L2.42 13.52 L2.42 10.48 L5.02 9.87 L5.55 8.57 L4.15 6.30 L6.30 4.15 L8.57 5.55Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <section class="pane" id="setup">
    <div class="wheels">
      <div class="band"></div>
      <button class="rz off" id="rz" data-i18n-title="resetNow" data-i18n-aria="resetNow" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 13A8 8 0 1 0 6.4 6.3"/><path d="M4.5 3.5v4h4"/><path d="M12 8v4.3l2.8 1.7"/></svg></button>
      <div class="wcolw apw"><div class="wcol ap" id="wap" tabindex="0" data-i18n-aria="ampmLabel"></div></div>
      <div class="wcolw"><div class="wcol" id="wh" tabindex="0" data-i18n-aria="hourLabel"></div></div>
      <span class="wsep">:</span>
      <div class="wcolw"><div class="wcol" id="wm" tabindex="0" data-i18n-aria="minuteLabel"></div></div>
    </div>
    <div class="chips">
      <button class="chip" data-p="60"></button>
      <button class="chip" data-p="300"></button>
      <button class="chip" data-p="600"></button>
      <button class="chip" data-p="1500"></button>
      <button class="chip" data-p="3600"></button>
    </div>
    <div class="at" id="endline"></div>
    <button class="go" id="go" data-i18n="start"></button>
  </section>

  <section class="pane" id="run" hidden>
    <div class="ring">
      <svg viewBox="0 0 190 190"><circle class="tr" cx="95" cy="95" r="80"/><circle class="pg" id="pg" cx="95" cy="95" r="80"/></svg>
      <div class="mid"><div class="ampm" id="ampm"></div><div class="left" id="left">0:00</div><div class="sub" id="sub"></div></div>
    </div>
    <div class="row"><button class="b" id="ba"></button><button class="b" id="bb"></button><button class="b" id="bc"></button><span class="gap" id="gap"></span>
      <button class="ib" id="bx" data-i18n-title="cancel" data-i18n-aria="cancel"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  </section>

  <!-- 타이머: 분 : 초 다이얼 + 칩(그 시간으로 맞춤) -->
  <section class="pane" id="cdsetup" hidden>
    <div class="wheels">
      <div class="band"></div>
      <div class="wcolw"><div class="wcol" id="wcm" tabindex="0" data-i18n-aria="minuteLabel"></div></div>
      <span class="wsep">:</span>
      <div class="wcolw"><div class="wcol" id="wcs" tabindex="0" data-i18n-aria="secondLabel"></div></div>
    </div>
    <div class="chips" id="cdchips">
      <button class="chip" data-c="60"></button>
      <button class="chip" data-c="300"></button>
      <button class="chip" data-c="600"></button>
      <button class="chip" data-c="1500"></button>
      <button class="chip" data-c="3600"></button>
    </div>
    <button class="go" id="cdgo" data-i18n="start"></button>
  </section>

  <section class="pane" id="set" hidden>
    <div class="card">
      <h2 data-i18n="appearance"></h2>
      <div class="tri" role="radiogroup" data-i18n-aria="appearance">
        <label><input type="radio" name="theme" value="auto"><span data-i18n="themeAuto"></span></label>
        <label><input type="radio" name="theme" value="light"><span data-i18n="themeLight"></span></label>
        <label><input type="radio" name="theme" value="dark"><span data-i18n="themeDark"></span></label>
      </div>
      <p data-i18n="themeHint"></p>
    </div>
    <div class="card">
      <h2 data-i18n="menuTimes"></h2>
      <div class="pre">
        <input type="number" min="1" max="1439" id="p0">
        <input type="number" min="1" max="1439" id="p1">
        <input type="number" min="1" max="1439" id="p2">
        <input type="number" min="1" max="1439" id="p3">
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="whenUp"></h2>
      <label class="tg"><span data-i18n="optWindow"></span><input type="checkbox" id="alertWindow"></label>
      <label class="tg"><span data-i18n="optSound"></span><input type="checkbox" id="sound"></label>
      <button class="mini" id="test" data-i18n="preview"></button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
