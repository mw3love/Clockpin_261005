<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>빠른 타이머 설정</title>
<link rel="stylesheet" href="ui.css">
<script src="common.js"></script>
<style>
  body { padding: 40px 16px; }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-family: var(--round); font-weight: 400; font-size: 28px; margin: 0; }
  section { background: var(--surf); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; font-size: 15px; }
  p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .presets label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--muted); }
  .presets input { width: 100%; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tog input { width: 20px; height: 20px; accent-color: var(--coral); }
  .saved { font-size: 12px; color: var(--muted); min-height: 18px; }
  .theme { display: flex; gap: 6px; }
  .theme label { flex: 1; text-align: center; cursor: pointer; font-size: 13px; padding: 8px 0; border-radius: 10px; background: var(--bg); color: var(--muted); }
  .theme input { position: absolute; opacity: 0; }
  .theme label:has(input:checked) { background: var(--ink); color: var(--bg); }
  .theme label:has(input:focus-visible) { outline: 2px solid var(--coral); outline-offset: 2px; }
  .test { all: unset; cursor: pointer; font-size: 12.5px; padding: 5px 12px; border-radius: 99px; background: var(--bg); align-self: flex-start; }
</style>
</head>
<body>
<main>
  <h1>빠른 타이머 설정</h1>
  <section>
    <h2>화면 색</h2>
    <p>「자동」은 맥의 라이트·다크 모드를 따라가요.</p>
    <div class="theme" role="radiogroup" aria-label="화면 색">
      <label><input type="radio" name="theme" value="auto">자동</label>
      <label><input type="radio" name="theme" value="light">밝게</label>
      <label><input type="radio" name="theme" value="dark">어둡게</label>
    </div>
  </section>
  <section>
    <h2>우클릭 메뉴의 시간</h2>
    <p>툴바 아이콘을 우클릭하면 나오는 네 가지 시간이에요. 분 단위로 적어 주세요.</p>
    <div class="presets">
      <label>1번<input type="number" min="1" max="1439" id="p0"></label>
      <label>2번<input type="number" min="1" max="1439" id="p1"></label>
      <label>3번<input type="number" min="1" max="1439" id="p2"></label>
      <label>4번<input type="number" min="1" max="1439" id="p3"></label>
    </div>
  </section>
  <section>
    <h2>시간이 됐을 때</h2>
    <p>운영체제 알림은 항상 떠요. 아래 두 가지는 켜고 끌 수 있어요.</p>
    <label class="tog"><span>작은 알림 창도 띄우기</span><input type="checkbox" id="alertWindow"></label>
    <label class="tog"><span>알림음 울리기 (끌 때까지 최대 30초)</span><input type="checkbox" id="sound"></label>
    <button class="test" id="test">알림음 들어 보기</button>
  </section>
  <div class="saved" id="saved"></div>
</main>
<script src="options.js"></script>
</body>
</html>
